<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>გადმოწერა</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            background: #16213e;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 12px;
            font-size: 24px;
        }

        p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .download-btn {
            display: inline-block;
            padding: 14px 40px;
            background: #0f3460;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: background 0.2s;
        }

        .download-btn:hover {
            background: #533483;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ფაილის გადმოწერა</h1>
        <p>დააჭირეთ ღილაკს გადმოწერის დასაწყებად</p>
        <a href="/download?id=1253" class="download-btn">გადმოწერე ფაილი</a>
    </div>
</body>
</html>
